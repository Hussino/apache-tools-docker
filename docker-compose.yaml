name: bigdata-lab

services:
  namenode-init:
    image: apache/hadoop:3.5.0
    user: root
    command:
      [
        "bash",
        "-c",
        "chown -R hadoop:hadoop /hadoop/dfs/name && if [ ! -d /hadoop/dfs/name/current ]; then su -s /bin/bash hadoop -c '/opt/hadoop/bin/hdfs namenode -format -nonInteractive'; else echo 'NameNode already formatted'; fi"
      ]
    volumes:
      - namenode_data:/hadoop/dfs/name
      - ./hadoop/etc/hadoop:/opt/hadoop/etc/hadoop:ro
    networks: [bigdata-net]

  namenode:
    image: apache/hadoop:3.5.0
    hostname: namenode
    command: ["hdfs", "namenode"]
    user: hadoop
    depends_on:
      namenode-init:
        condition: service_completed_successfully
    environment:
      HADOOP_CONF_DIR: /opt/hadoop/etc/hadoop
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -lc 'exec 3<>/dev/tcp/127.0.0.1/9870'"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 40s
    ports:
      - "9870:9870"
      - "9000:9000"
    volumes:
      - namenode_data:/hadoop/dfs/name
      - namenode_tmp:/tmp/hadoop-root
      - ./hadoop/etc/hadoop:/opt/hadoop/etc/hadoop:ro
    networks: [bigdata-net]

  datanode-init:
    image: apache/hadoop:3.5.0
    user: root
    command:
      [
        "bash",
        "-c",
        "mkdir -p /hadoop/dfs/data && chown -R hadoop:hadoop /hadoop/dfs/data"
      ]
    volumes:
      - datanode_data:/hadoop/dfs/data
    networks: [bigdata-net]

  datanode:
    image: apache/hadoop:3.5.0
    hostname: datanode
    command: ["hdfs", "datanode"]
    user: hadoop
    depends_on:
      datanode-init:
        condition: service_completed_successfully
      namenode:
        condition: service_healthy
    environment:
      HADOOP_CONF_DIR: /opt/hadoop/etc/hadoop
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -lc 'exec 3<>/dev/tcp/127.0.0.1/9864'"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 40s
    volumes:
      - datanode_data:/hadoop/dfs/data
      - datanode_tmp:/tmp/hadoop-root
      - ./hadoop/etc/hadoop:/opt/hadoop/etc/hadoop:ro
    networks: [bigdata-net]

  resourcemanager:
    image: apache/hadoop:3.5.0
    hostname: resourcemanager
    command: ["yarn", "resourcemanager"]
    user: hadoop
    depends_on:
      namenode:
        condition: service_healthy
      datanode:
        condition: service_healthy
    environment:
      HADOOP_CONF_DIR: /opt/hadoop/etc/hadoop
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -lc 'exec 3<>/dev/tcp/127.0.0.1/8088'"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 40s
    ports:
      - "8088:8088"
    volumes:
      - resourcemanager_tmp:/tmp/hadoop-root
      - ./hadoop/etc/hadoop:/opt/hadoop/etc/hadoop:ro
    networks: [bigdata-net]

  nodemanager:
    image: apache/hadoop:3.5.0
    hostname: nodemanager
    command: ["yarn", "nodemanager"]
    user: hadoop
    depends_on:
      resourcemanager:
        condition: service_healthy
    environment:
      HADOOP_CONF_DIR: /opt/hadoop/etc/hadoop
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -lc 'exec 3<>/dev/tcp/127.0.0.1/8042'"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 40s
    ports:
      - "8042:8042"
    volumes:
      - nodemanager_local:/tmp/hadoop-root
      - ./hadoop/etc/hadoop:/opt/hadoop/etc/hadoop:ro
    networks: [bigdata-net]

  historyserver:
    image: apache/hadoop:3.5.0
    hostname: historyserver
    command: ["mapred", "historyserver"]
    user: hadoop
    depends_on:
      resourcemanager:
        condition: service_healthy
    environment:
      HADOOP_CONF_DIR: /opt/hadoop/etc/hadoop
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -lc 'exec 3<>/dev/tcp/127.0.0.1/19888'"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 40s
    ports:
      - "19888:19888"
    volumes:
      - historyserver_data:/tmp/hadoop-root
      - ./hadoop/etc/hadoop:/opt/hadoop/etc/hadoop:ro
    networks: [bigdata-net]

  postgres:
    image: postgres:16
    hostname: postgres
    environment:
      POSTGRES_DB: metastore_db
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: hivepassword
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hive -d metastore_db -h 127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [bigdata-net]

  hive-metastore:
    build:
      context: ./hive
    hostname: hive-metastore
    depends_on:
      postgres:
        condition: service_healthy
      namenode:
        condition: service_healthy
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
      HADOOP_CLASSPATH: /opt/hadoop/share/hadoop/tools/lib/*
      HIVE_CUSTOM_CONF_DIR: /opt/hadoop/etc/hadoop
      SERVICE_OPTS: >-
        -Xmx1G
        -Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver
        -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://postgres:5432/metastore_db
        -Djavax.jdo.option.ConnectionUserName=hive
        -Djavax.jdo.option.ConnectionPassword=hivepassword
        -Dhive.metastore.schema.verification=false
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -lc 'exec 3<>/dev/tcp/127.0.0.1/9083'"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 40s
    ports:
      - "9083:9083"
    volumes:
      - hive_warehouse:/opt/hive/data/warehouse
      - hive_scratch:/opt/hive/scratch
      - ./hadoop/etc/hadoop:/opt/hadoop/etc/hadoop:ro
    networks: [bigdata-net]

  hive-server2:
    build:
      context: ./hive
    hostname: hive-server2
    depends_on:
      hive-metastore:
        condition: service_healthy
    environment:
      SERVICE_NAME: hiveserver2
      DB_DRIVER: postgres
      HADOOP_CLASSPATH: /opt/hadoop/share/hadoop/tools/lib/*
      HIVE_SERVER2_THRIFT_PORT: 10000
      HIVE_SCRATCH_DIR: /opt/hive/scratch
      HIVE_QUERY_RESULTS_CACHE_DIRECTORY: /opt/hive/scratch/_resultscache_
      HIVE_CUSTOM_CONF_DIR: /opt/hadoop/etc/hadoop
      SERVICE_OPTS: >-
        -Xmx1G
        -Dhive.metastore.uris=thrift://hive-metastore:9083
        -Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver
        -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://postgres:5432/metastore_db
        -Djavax.jdo.option.ConnectionUserName=hive
        -Djavax.jdo.option.ConnectionPassword=hivepassword
      IS_RESUME: "true"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -lc 'exec 3<>/dev/tcp/127.0.0.1/10000'"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 40s
    ports:
      - "10003:10000"
      - "10002:10002"
    volumes:
      - hive_warehouse:/opt/hive/data/warehouse
      - hive_scratch:/opt/hive/scratch
      - ./hadoop/etc/hadoop:/opt/hadoop/etc/hadoop:ro
    networks: [bigdata-net]

  spark-master:
    image: apache/spark:4.1.1-scala2.13-java17-ubuntu
    hostname: spark-master
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master", "-h", "spark-master"]
    depends_on:
      namenode:
        condition: service_healthy
    ports:
      - "7077:7077"
      - "8080:8080"
    environment:
      HADOOP_CONF_DIR: /opt/hadoop/etc/hadoop
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -lc 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - spark_master_work:/opt/spark/work
      - spark_master_logs:/opt/spark/logs
      - ./hadoop/etc/hadoop:/opt/hadoop/etc/hadoop:ro
    networks: [bigdata-net]

  spark-worker:
    image: apache/spark:4.1.1-scala2.13-java17-ubuntu
    hostname: spark-worker
    user: root
    command: >
      bash -c "
      chown -R spark:spark /opt/spark/work /opt/spark/logs &&
      exec /opt/spark/bin/spark-class
      org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077
      "
    depends_on:
      spark-master:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      HADOOP_CONF_DIR: /opt/hadoop/etc/hadoop
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -lc 'exec 3<>/dev/tcp/127.0.0.1/8081'"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - spark_worker_work:/opt/spark/work
      - spark_worker_logs:/opt/spark/logs
      - ./hadoop/etc/hadoop:/opt/hadoop/etc/hadoop:ro
      - ./spark/worker-entrypoint.sh:/opt/entrypoint/worker-entrypoint.sh:ro
    networks: [bigdata-net]

  nifi:
    image: apache/nifi:2.9.0
    hostname: nifi
    ports:
      - "8444:8443"
    environment:
      - SINGLE_USER_CREDENTIALS_USERNAME=admin
      - SINGLE_USER_CREDENTIALS_PASSWORD=admin12345678
      - NIFI_WEB_PROXY_HOST=${EXTERNAL_IP}:8444
      - NIFI_NAR_LIBRARY_DIRECTORY=/opt/nifi/nifi-current/nar_extensions
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -lc 'exec 3<>/dev/tcp/127.0.0.1/8443'"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 60s
    volumes:
      - nifi_logs:/opt/nifi/nifi-current/logs
      - nifi_conf:/opt/nifi/nifi-current/conf
      - nifi_db:/opt/nifi/nifi-current/database_repository
      - nifi_flowfile:/opt/nifi/nifi-current/flowfile_repository
      - nifi_content:/opt/nifi/nifi-current/content_repository
      - nifi_provenance:/opt/nifi/nifi-current/provenance_repository
      - nifi_state:/opt/nifi/nifi-current/state
      # - nifi_nar:/opt/nifi/nifi-current/nar_extensions
      - nifi_python:/opt/nifi/nifi-current/python_extensions
      - ./nifi/drivers:/opt/nifi/nifi-current/drivers
      - ./nifi/lab_data:/lab_data
      - ./nifi/extensions:/opt/nifi/nifi-current/nar_extensions
      - ./hadoop/etc/hadoop:/opt/hadoop/etc/hadoop:ro
    networks: [bigdata-net]

  kafka:
    image: apache/kafka:4.2.0
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_LOG_DIRS: /var/lib/kafka/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -lc 'exec 3<>/dev/tcp/127.0.0.1/9092'"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 40s
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - bigdata-net

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-new-ui
    ports:
      - "8093:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -lc 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - bigdata-net

networks:
  bigdata-net:
    name: bigdata-net

volumes:
  namenode_data:
  namenode_tmp:
  datanode_data:
  datanode_tmp:
  resourcemanager_tmp:
  nodemanager_local:
  historyserver_data:
  postgres_data:
  hive_warehouse:
  hive_scratch:
  spark_master_work:
  spark_master_logs:
  spark_worker_work:
  spark_worker_logs:
  nifi_logs:
  nifi_conf:
  nifi_db:
  nifi_flowfile:
  nifi_content:
  nifi_provenance:
  nifi_state:
  nifi_nar:
  nifi_python:
  kafka_data: